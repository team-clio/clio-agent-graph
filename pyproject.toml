[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clio-agent-graph"
version = "0.1.0"
description = "LangGraph Agent Server for Clio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "langgraph-cli[inmem]>=0.4,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.11,<1.0",
]
openai = [
  "langchain-openai>=1.0,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clio_agent_graph"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
