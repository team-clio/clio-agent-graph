global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: clio-agent-graph
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: clio-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8080]
