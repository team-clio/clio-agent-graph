groups:
  - name: clio-operational-alerts
    rules:
      - alert: ClioWorkflowStuck
        expr: clio_workflow_stuck > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "실행 중인 workflow가 정체 기준을 넘었습니다."
          action: "Grafana Tempo에서 같은 시간대의 clio.workflow trace를 확인합니다."
      - alert: ClioWorkflowFailure
        expr: sum(increase(clio_workflow_failure_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "최근 5분 동안 workflow 실패가 발생했습니다."
          action: "error_kind와 request_type별 증가량을 확인합니다."
      - alert: ClioPersistenceFailure
        expr: sum(increase(clio_workflow_failure_total{error_kind="persistence"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "workflow 결과 또는 checkpoint 저장 실패가 발생했습니다."
          action: "workflow_run_id가 있는 구조화 로그와 DB 연결 상태를 확인합니다."
      - alert: ClioExecutionLimitReached
        expr: sum(increase(clio_execution_limit_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Agent 실행 한도에 도달한 요청이 발생했습니다."
          action: "limit_type과 해당 trace의 tool/model 호출 반복을 확인합니다."
